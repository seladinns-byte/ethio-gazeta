<!DOCTYPE html>
<html lang="am">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Ethio Gazeta Admin</title>

  <link rel="stylesheet" href="Style.css">
</head>

<body>

  <h1>Ethio Gazeta Admin Panel</h1>
<button onclick="logout()">
  🚪 Logout
</button>

  <h2>አዲስ ዜና ጨምር</h2>

  <input
    id="title"
    type="text"
    placeholder="የዜና ርዕስ"
  >

  <br><br>

  <textarea
    id="content"
    placeholder="የዜና ዝርዝር">

<br><br>

<select id="category">

  <option value="ዋና ዜና">📰 ዋና ዜና</option>

  <option value="ስፖርት">⚽ ስፖርት</option>

  <option value="ቴክኖሎጂ">💻 ቴክኖሎጂ</option>

  <option value="ዓለም አቀፍ">🌍 ዓለም አቀፍ</option>

</select>


  </textarea>

  

  <input
    id="image"
    type="file"
    accept="image/*"
  >

  <br><br>

  <button onclick="addNews()">
    📰 ዜና ጨምር
  </button>

  <hr>
<input
  type="text"
  id="search"
  placeholder="🔍 ዜና ፈልግ..."
  oninput="searchNews()"
>

  <h2>የተቀመጡ ዜናዎች</h2>

  <div id="news"></div>

  <script
    type="module"
    src="admin.js">
  </script>

</body>

</html>
