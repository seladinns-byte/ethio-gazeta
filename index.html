<!DOCTYPE html>
<html lang="am">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Ethio Gazeta</title>

  <link rel="stylesheet" href="Style.css">
</head>

<body>

  <!-- Header -->
  <header>

    <img src="logo.jpg"
         alt="Ethio Gazeta Logo">

    <h1>Ethio Gazeta</h1>

    <p>እውነተኛ ዜና ለሁሉም</p>

  </header>


  <!-- Navigation -->
  <nav>

    <a href="#">Home</a>

    <a href="#news">News</a>

    <a href="#">Sport</a>

    <a href="#">Technology</a>

    <a href="#">Contact</a>

  </nav>


  <!-- Main -->
  <main>

    <h2 class="section-title">
      ዋና ዜናዎች
    </h2>


    <!-- Firebase News -->
  <div class="categories">

  <button onclick="filterNews('all')">ሁሉም</button>

  <button onclick="filterNews('ዋና ዜና')">📰 ዋና ዜና</button>

  <button onclick="filterNews('ስፖርት')">⚽ ስፖርት</button>

  <button onclick="filterNews('ቴክኖሎጂ')">💻 ቴክኖሎጂ</button>

  <button onclick="filterNews('ዓለም አቀፍ')">🌍 ዓለም አቀፍ</button>

</div>

<br>

<div id="news"></div>
    <div id="news">

      <!-- ዜናዎች ከ Firebase እዚህ ይመጣሉ -->

    </div>


    <!-- Search -->
    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="ዜና ፈልግ..."
      >

      <button onclick="searchNews()">
        ፈልግ
      </button>

    </div>

  </main>


  <!-- Footer -->
  <footer>

    <p>© 2026 Ethio Gazeta</p>

    <p>እውነተኛ ዜና ለሁሉም</p>

  </footer>


  <!-- JavaScript -->
  <script
    type="module"
    src="script.js">
  </script>

</body>

</html>
