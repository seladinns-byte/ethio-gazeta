<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ethio Gazeta - Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>ETHIO GAZETA</h1>

<div style="width:300px; margin:auto;">

  <h2>Admin Login</h2>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <br><br>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <br><br>

  <button onclick="login()">
    Login
  </button>

  <p id="message"></p>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
